<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Резюме</title>
    <style>
        :root {
            --primary: #2563eb; 
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .page {
            display: none; 
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .page.active { display: block; }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        p { line-height: 1.7; color: #475569; }

        .project-card {
            border-left: 3px solid var(--primary);
            padding-left: 15px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }

        .celebrity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .celebrity-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: #e2e8f0;
        }
        
        .wiki-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .wiki-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="nav-btn active" onclick="showPage('about', this)">О себе</div>
        <div class="nav-btn" onclick="showPage('skills', this)">Навыки</div>
        <div class="nav-btn" onclick="showPage('projects', this)">Проекты</div>
    </nav>

    <section id="about" class="page active">
        <h2>О себе</h2>
        <div class="project-card">
            <p>Обучаюсь программированию, пока что навыков и опыта мало, сейчас нарабатываю это все и в дальнейшем буду пробовать работать с чем нибудь посеръёзнее</p>
        </div>
    </section>

    <section id="skills" class="page">
        <h2>Навыки</h2>
        <div class="project-card">
            <p>Умею интегрировать открытые мировые API (Wikipedia API) без ограничений CORS.</p>
        </div>
    </section>

    <section id="projects" class="page">
        <h2>Проекты и планы</h2>
        <div style="margin-top: 25px; text-align: center;">
            <button class="nav-btn" onclick="getAnyHumanFromWiki()">Найти случайного человека</button>
        </div>
        <div id="api-result-container" style="margin-top: 20px;"></div>
    </section>
</div>

<script>
    function showPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    async function getAnyHumanFromWiki() {
        const container = document.getElementById('api-result-container');
        container.innerHTML = '<div class="project-card"><p>Ищу случайного человека в архивах Википедии...</p></div>';
        
        const baseWikiApi = "https://wikipedia.org";
        
        try {
            const randomYear = Math.floor(Math.random() * (2005 - 1940 + 1)) + 1940;
            const categoryName = `Категория:Родившиеся_в_${randomYear}_году`;
            
            const listUrl = `${baseWikiApi}&list=categorymembers&cmtitle=${encodeURIComponent(categoryName)}&cmlimit=500`;
            const listResponse = await fetch(listUrl);
            const listData = await listResponse.json();
            const members = listData.query.categorymembers;
            
            const humanPages = members.filter(m => m.ns === 0);
            
            if (humanPages.length === 0) throw new Error("Люди не найдены");
            
            const randomPerson = humanPages[Math.floor(Math.random() * humanPages.length)];

            const detailUrl = `${baseWikiApi}&prop=pageimages|extractsummary&piprop=original&exintro=&explaintext=&pageids=${randomPerson.pageid}`;
            const detailResponse = await fetch(detailUrl);
            const detailData = await detailResponse.json();
            
            const page = detailData.query.pages[randomPerson.pageid];
            
            let name = page.title;
            if (name.includes(',')) {
                const parts = name.split(',');
                name = `${parts[1].trim()} ${parts[0].trim()}`;
            }
            
            const photo = page.original ? page.original.source : "https://unsplash.com";
            
            const summary = page.extract ? page.extract.split('.')[0] + '.' : "Информация о деятельности отсутствует в краткой выжимке.";
            const wikiLink = `https://wikipedia.org{page.pageid}`;

            container.innerHTML = `
                <div class="project-card" style="border-color: #10b981;">
                    <h3>Личность найдена!</h3>
                    <div class="celebrity-box">
                        <img class="celebrity-img" src="${photo}" alt="${name}">
                        <div>
                            <p style="margin: 0;">Имя: <strong>${name}</strong></p>
                            <p style="margin: 5px 0 0 0; font-size: 0.9rem; color: #475569;">${summary}</p>
                            <a href="${wikiLink}" target="_blank" class="wiki-link">Читать полную биографию на Википедии →</a>
                        </div>
                    </div>
                </div>
            `;
            
        } catch (error) {
            container.innerHTML = `
                <div class="project-card" style="border-color: #ef4444;">
                    <p>Не удалось получить данные. Попробуйте еще раз.</p>
                </div>`;
        }
    }
</script>

</body>
</html>
