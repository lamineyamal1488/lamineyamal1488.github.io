<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Резюме</title>
    <style>
        :root {
            --primary: #2563eb; 
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { margin-bottom: 8px; font-size: 2rem; }

        .contact-info {
            color: #64748b;
            font-size: 0.95rem;
        }

       
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .page {
            display: none; 
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.4s ease-out;
        }

        .page.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        p { line-height: 1.7; color: #475569; }

        ul { padding-left: 20px; list-style: none; }

        li {
            margin-bottom: 12px;
            position: relative;
            color: #475569;
        }

        li::before {
            content: "•";
            color: var(--primary);
            font-weight: bold;
            position: absolute;
            left: -15px;
        }

        .project-card {
            border-left: 3px solid var(--primary);
            padding-left: 15px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="nav-btn active" onclick="showPage('about', this)">О себе</div>
        <div class="nav-btn" onclick="showPage('skills', this)">Навыки</div>
        <div class="nav-btn" onclick="showPage('projects', this)">Проекты</div>
    </nav>

    <section id="about" class="page active">
        <h2>О себе</h2>
        <div class="project-card">
            <p>Обучаюсь программированию, пока что навыков и опыта мало, сейчас нарабатываю это все и в дальнейшем буду пробовать работать с чем нибудь посеръёзнее</p>
        </div>
    </section>

    <section id="skills" class="page">
        <h2>Навыки</h2>
        <div class="project-card">
            <ul>
                Пока нету
            </ul>
        </div>
    </section>

    <section id="projects" class="page">
        <h2>Проекты и планы</h2>
        <div style="margin-top: 25px; text-align: center;">
            <button class="nav-btn" onclick="loadRandomFact()">Получить цитату</button>
        </div>
        <div id="api-result-container" style="margin-top: 20px;"></div>
    </section>
</div>

<script>
    function showPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    async function loadRandomFact() {
        const container = document.getElementById('api-result-container');
        container.innerHTML = '<div class="project-card"><p>Загрузка цитаты...</p></div>';
        
        try {
            const response = await fetch('https://quotable.io');
            
            let data;
            if (response.ok) {
                data = await response.json();
            } else {
                const fallback = await fetch('https://allorigins.win' + encodeURIComponent('https://zenquotes.io'));
                const fallbackData = await fallback.json();
                const jsonContent = JSON.parse(fallbackData.contents);
                data = { content: jsonContent[0].q, author: jsonContent[0].a };
            }
            
            const rawQuote = data.content;
            const author = data.author;

            const translateResponse = await fetch(`https://translated.net{encodeURIComponent(rawQuote)}&langpair=en|ru`);
            let translatedQuote = rawQuote;
            
            if (translateResponse.ok) {
                const translateData = await translateResponse.json();
                translatedQuote = translateData.responseData.translatedText;
            }

            container.innerHTML = `
                <div class="project-card" style="border-color: #10b981;">
                    <h3>Цитата дня из API:</h3>
                    <p><em>"${translatedQuote}"</em></p>
                    <small style="color: #64748b; font-weight: bold;">— ${author}</small>
                </div>
            `;
            
        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="project-card"><p>Ошибка сети при вызове API.</p></div>';
        }
    }
</script>

</body>
</html>
