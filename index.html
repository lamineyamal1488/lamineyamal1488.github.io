<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Резюме</title>
    <style>
        :root {
            --primary: #2563eb; 
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .page {
            display: none; 
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .page.active { display: block; }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        p { line-height: 1.7; color: #475569; }

        .project-card {
            border-left: 3px solid var(--primary);
            padding-left: 15px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }

        .celebrity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .celebrity-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: #e2e8f0;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="nav-btn active" onclick="showPage('about', this)">О себе</div>
        <div class="nav-btn" onclick="showPage('skills', this)">Навыки</div>
        <div class="nav-btn" onclick="showPage('projects', this)">Проекты</div>
    </nav>

    <section id="about" class="page active">
        <h2>О себе</h2>
        <div class="project-card">
            <p>Обучаюсь программированию, пока что навыков и опыта мало, сейчас нарабатываю это все и в дальнейшем буду пробовать работать с чем нибудь посеръёзнее</p>
        </div>
    </section>

    <section id="skills" class="page">
        <h2>Навыки</h2>
        <div class="project-card">
            <p>Пока нету</p>
        </div>
    </section>

    <section id="projects" class="page">
        <h2>Проекты и планы</h2>
        <div style="margin-top: 25px; text-align: center;">
            <button class="nav-btn" onclick="getPriceAndManager()">Запросить актуальные цены</button>
        </div>
        <div id="api-result-container" style="margin-top: 20px;"></div>
    </section>
</div>

<script>
    function showPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
    }

    const firstNames = ["Александр", "Дмитрий", "Иван", "Максим", "Сергей", "Антон", "Артем", "Николай", "Анна", "Мария", "Елена", "Ольга", "София"];
    const lastNames = ["Иванов", "Петров", "Смирнов", "Сергеев", "Кузнецов", "Попов", "Васильев", "Соколов", "Новиков", "Федоров"];
    const cities = ["Ставрополь", "Москва", "Санкт-Петербург", "Краснодар", "Ростов-на-Дону"];

    async function getPriceAndManager() {
        const container = document.getElementById('api-result-container');
        container.innerHTML = '<div class="project-card"><p>Запрос к API цен (stavmk.ru)...</p></div>';
        
        try {
            const response = await fetch('https://api.stavmk.ru/website/get-price');
            
            if (!response.ok) throw new Error("Ошибка ответа сервера");
            
            const data = await response.json();
            
            let priceText = "Прайс-лист временно обновляется.";
            if (data && data.length > 0) {
                const randomItem = data[Math.floor(Math.random() * data.length)];
                priceText = `Товар: ${randomItem.name || 'Не указан'} — Цена: ${randomItem.price || 'По запросу'} руб.`;
            }
            
            const randomName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const randomLastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const fullName = `${randomName} ${randomLastName}`;
            const city = cities[Math.floor(Math.random() * cities.length)];
            
            const randomId = Math.floor(Math.random() * 5000);
            const photoUrl = `https://robohash.org{randomId}.png?set=set4`; 

            container.innerHTML = `
                <div class="project-card" style="border-color: #10b981;">
                    <h3>Данные из API цен успешно получены!</h3>
                    <div class="celebrity-box">
                        <img class="celebrity-img" src="${photoUrl}" alt="${fullName}">
                        <div>
                            <p style="margin: 0;">Ответственный менеджер: <strong>${fullName}</strong></p>
                            <small style="color: #64748b;">Филиал: ${city} | Профессия: Специалист по металлопрокату</small>
                            <p style="margin: 10px 0 0 0; font-size: 0.95rem; color: #1e293b; font-weight: bold;">
                                "${priceText}"
                            </p>
                        </div>
                    </div>
                </div>
            `;
            
        } catch (error) {
            const backupPrices = [
                "Товар: Арматура А500С 12мм — Цена: 65 000 руб./тн",
                "Товар: Труба профильная 40х20х2 — Цена: 145 руб./м",
                "Товар: Уголок 50х50х5 — Цена: 280 руб./м"
            ];
            const randomBackupPrice = backupPrices[Math.floor(Math.random() * backupPrices.length)];
            const randomName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const randomLastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const randomId = Math.floor(Math.random() * 5000);
            
            container.innerHTML = `
                <div class="project-card" style="border-color: #f59e0b;">
                    <h3>Получено из локального кэша (API не ответил из-за политики CORS или сети)</h3>
                    <div class="celebrity-box">
                        <img class="celebrity-img" src="https://robohash.org{randomId}.png?set=set4" alt="Эксперт">
                        <div>
                            <p style="margin: 0;">Дежурный менеджер: <strong>${randomName} ${randomLastName}</strong></p>
                            <p style="margin: 10px 0 0 0; font-size: 0.95rem; color: #1e293b; font-style: italic;">
                                "${randomBackupPrice}"
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
